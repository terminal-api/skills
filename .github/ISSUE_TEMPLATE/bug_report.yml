name: Bug report
description: Report incorrect or unsafe skill or plugin behavior.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Terminal's agent tooling. Do not include credentials or customer data.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - terminal-fleet-data skill
        - terminal-cli skill
        - build-with-terminal skill
        - Plugin or marketplace manifest
        - Validation or CI
        - Documentation
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Agent client and version
      placeholder: Claude Code, Codex, Cursor, or another Agent Skills client
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include a minimal, redacted prompt or installation sequence when possible.
  - type: checkboxes
    id: security
    attributes:
      label: Security check
      options:
        - label: This report does not contain credentials, customer data, or a security vulnerability. I will report security issues privately according to SECURITY.md.
          required: true
